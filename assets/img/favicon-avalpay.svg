<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="arm-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8EEF9"/>
      <stop offset="50%" stop-color="#62CCE8"/>
      <stop offset="100%" stop-color="#3AADD4"/>
    </linearGradient>
    <linearGradient id="arm-bot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3AADD4"/>
      <stop offset="50%" stop-color="#62CCE8"/>
      <stop offset="100%" stop-color="#C8EEF9"/>
    </linearGradient>
    <linearGradient id="shine-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAFAFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#EAFAFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine-bot" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EAFAFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#EAFAFF" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <!-- Upper arm -->
  <line x1="10" y1="10" x2="88" y2="50" stroke="url(#arm-top)" stroke-width="18" stroke-linecap="round"/>
  <line x1="10" y1="10" x2="88" y2="50" stroke="url(#shine-top)" stroke-width="8" stroke-linecap="round"/>
  <!-- Lower arm -->
  <line x1="10" y1="90" x2="88" y2="50" stroke="url(#arm-bot)" stroke-width="18" stroke-linecap="round"/>
  <line x1="10" y1="90" x2="88" y2="50" stroke="url(#shine-bot)" stroke-width="8" stroke-linecap="round"/>
</svg>
